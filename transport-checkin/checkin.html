<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Driver Check-In v4</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --black: #0a0a0a;
    --yellow: #FFD000;
    --yellow-dark: #e6bb00;
    --white: #ffffff;
    --gray: #f2f2f2;
    --gray2: #e0e0e0;
    --text: #0a0a0a;
    --text2: #444;
    --red: #d32f2f;
    --green: #1b7a3e;
    --radius: 6px;
  }

  html, body {
    min-height: 100vh;
    background: var(--black);
    font-family: 'Noto Sans', sans-serif;
  }

  /* Diagonal header stripe */
  .page-header {
    background: var(--yellow);
    padding: 28px 20px 22px;
    position: relative;
    overflow: hidden;
  }
  .page-header::after {
    content: '';
    position: absolute;
    bottom: -20px;
    left: 0; right: 0;
    height: 40px;
    background: var(--black);
    clip-path: polygon(0 50%, 100% 0, 100% 100%, 0 100%);
  }
  .header-inner {
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: 540px;
    margin: 0 auto;
  }
  .header-icon-wrap {
    width: 56px; height: 56px;
    background: var(--black);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
  }
  .header-text {}
  .header-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 30px;
    color: var(--black);
    line-height: 1;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .header-sub {
    font-size: 13px;
    font-weight: 700;
    color: var(--black);
    opacity: 0.6;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 3px;
  }

  /* Body */
  .page-body {
    padding: 36px 20px 60px;
    max-width: 540px;
    margin: 0 auto;
  }

  .section-label {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--yellow);
    margin-bottom: 12px;
    padding-left: 10px;
    border-left: 3px solid var(--yellow);
  }

  .card {
    background: var(--white);
    border-radius: 10px;
    padding: 20px 16px;
    margin-bottom: 16px;
  }

  /* Fields */
  .field {
    margin-bottom: 16px;
  }
  .field:last-child { margin-bottom: 0; }

  .field-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text2);
    margin-bottom: 6px;
  }
  .field-label .req {
    color: var(--red);
    margin-left: 2px;
  }

  .field-input {
    width: 100%;
    background: var(--gray);
    border: 2px solid var(--gray2);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-family: 'Noto Sans', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, background 0.15s;
    -webkit-appearance: none;
  }
  .field-input:focus {
    border-color: var(--yellow-dark);
    background: var(--white);
  }
  .field-input::placeholder {
    color: #aaa;
    font-weight: 400;
  }

  /* Two-col grid */
  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .field-row .field { margin-bottom: 0; }

  /* Counter inputs */
  .counter-wrap {
    display: flex;
    align-items: center;
    gap: 0;
    border: 2px solid var(--gray2);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--gray);
    transition: border-color 0.15s;
  }
  .counter-wrap:focus-within {
    border-color: var(--yellow-dark);
    background: var(--white);
  }
  .counter-btn {
    width: 52px;
    height: 54px;
    background: var(--black);
    border: none;
    color: var(--yellow);
    font-size: 26px;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
    flex-shrink: 0;
    line-height: 1;
  }
  .counter-btn:active { background: #222; }
  .counter-input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 28px;
    color: var(--text);
    text-align: center;
    outline: none;
    padding: 8px 4px;
    min-width: 0;
    -webkit-appearance: none;
    -moz-appearance: textfield;
  }
  .counter-input::-webkit-outer-spin-button,
  .counter-input::-webkit-inner-spin-button { -webkit-appearance: none; }

  /* Submit button */
  .btn-submit {
    width: 100%;
    padding: 20px;
    background: var(--yellow);
    border: none;
    border-radius: 10px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 24px;
    letter-spacing: 1px;
    color: var(--black);
    cursor: pointer;
    text-transform: uppercase;
    transition: transform 0.1s, background 0.15s;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .btn-submit:active { transform: scale(0.98); background: var(--yellow-dark); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Success screen */
  .success-screen {
    display: none;
    text-align: center;
    padding: 48px 24px;
  }
  .success-screen.visible { display: block; }
  .success-icon {
    width: 90px; height: 90px;
    background: var(--yellow);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 44px;
    margin: 0 auto 24px;
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .success-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 36px;
    color: var(--yellow);
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 10px;
  }
  .success-sub {
    font-size: 16px;
    color: #aaa;
    margin-bottom: 8px;
    line-height: 1.5;
  }
  .success-time {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 22px;
    color: var(--white);
    margin-bottom: 32px;
  }
  .btn-again {
    display: inline-block;
    padding: 16px 36px;
    background: transparent;
    border: 3px solid var(--yellow);
    border-radius: 10px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 20px;
    color: var(--yellow);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: background 0.15s;
  }
  .btn-again:hover { background: rgba(255,208,0,0.1); }

  /* Error toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--red);
    color: white;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 24px;
    border-radius: 30px;
    white-space: nowrap;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Required note */
  .req-note {
    font-size: 12px;
    color: #888;
    text-align: center;
    margin-bottom: 20px;
  }
  .req-note span { color: var(--red); }

  /* Form wrapper for hide/show */
  #formWrap { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<div class="page-header">
  <div class="header-inner">
    <div class="header-icon-wrap">🚛</div>
    <div class="header-text">
      <div class="header-title">Driver Check-In</div>
      <div class="header-sub">Please complete all required fields &nbsp;|&nbsp; v4</div>
    </div>
  </div>
</div>

<div class="page-body">

  <!-- Form -->
  <div id="formWrap">
    <p class="req-note"><span>*</span> Required fields</p>

    <!-- Driver Info -->
    <div class="section-label">Driver Info</div>
    <div class="card">
      <div class="field">
        <label class="field-label" for="d_driver">Driver Name <span class="req">*</span></label>
        <input class="field-input" id="d_driver" type="text" placeholder="Your full name" autocomplete="name" autocapitalize="words" />
      </div>
      <div class="field">
        <label class="field-label" for="d_driverphone">Driver Phone <span class="req">*</span></label>
        <input class="field-input" id="d_driverphone" type="tel" placeholder="555-000-0000" oninput="autoPhone(this)" autocomplete="tel" />
      </div>
    </div>

    <!-- Carrier Info -->
    <div class="section-label">Carrier Info</div>
    <div class="card">
      <div class="field">
        <label class="field-label" for="d_carrier">Carrier Name <span class="req">*</span></label>
        <input class="field-input" id="d_carrier" type="text" placeholder="Company name" autocapitalize="words" />
      </div>
      <div class="field">
        <label class="field-label" for="d_carrierphone">Carrier Phone</label>
        <input class="field-input" id="d_carrierphone" type="tel" placeholder="555-000-0000" oninput="autoPhone(this)" />
      </div>
    </div>

    <!-- Vehicle Count -->
    <div class="section-label">Vehicle Count</div>
    <div class="card">
      <div class="field">
        <label class="field-label">Drop Off</label>
        <div class="counter-wrap">
          <button class="counter-btn" onclick="adjust('d_dropoff', -1)" type="button">-</button>
          <input class="counter-input" id="d_dropoff" type="number" value="0" min="0" />
          <button class="counter-btn" onclick="adjust('d_dropoff', 1)" type="button">+</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Pickup</label>
        <div class="counter-wrap">
          <button class="counter-btn" onclick="adjust('d_pickup', -1)" type="button">-</button>
          <input class="counter-input" id="d_pickup" type="number" value="0" min="0" />
          <button class="counter-btn" onclick="adjust('d_pickup', 1)" type="button">+</button>
        </div>
      </div>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="submitForm()">
      <span>&#10003;</span> Submit Check-In
    </button>
  </div>

  <!-- Success Screen -->
  <div class="success-screen" id="successScreen">
    <div class="success-icon">&#10003;</div>
    <div class="success-title">You're Checked In!</div>
    <div class="success-sub">Your check-in has been recorded.</div>
    <div class="success-time" id="successTime"></div>
    <div style="background:#0a0a0a;border-radius:12px;padding:20px;margin:16px 0 8px">
      <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#FFD000;margin-bottom:8px">Your Check-Out PIN</div>
      <div id="pinDisplay" style="font-family:'Black Han Sans',sans-serif;font-size:56px;color:#FFD000;letter-spacing:12px;line-height:1"></div>
      <div style="font-size:13px;color:rgba(255,255,255,0.6);margin-top:8px">Remember this number &mdash; you will need it to check out</div>
    </div>
    <button class="btn-again" onclick="resetForm()">New Check-In</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx5rRVcMJBFVsU6Zk311B3IK6K2xXoJfm0ED-jGVkT6fuaWw98kukXW0H1ZHSqHOwmeaA/exec';

function stripNonDigits(s) {
  var out = '';
  for (var i = 0; i < s.length; i++) {
    var code = s.charCodeAt(i);
    if (code >= 48 && code <= 57) out += s[i];
  }
  return out;
}

function autoPhone(input) {
  var digits = stripNonDigits(input.value).slice(0, 10);
  var f = digits;
  if (digits.length > 6) f = digits.slice(0,3) + '-' + digits.slice(3,6) + '-' + digits.slice(6);
  else if (digits.length > 3) f = digits.slice(0,3) + '-' + digits.slice(3);
  input.value = f;
}

function pad(n) { return String(n).padStart(2, '0'); }

function nowDate() {
  var d = new Date();
  return (d.getMonth()+1) + '/' + d.getDate() + '/' + d.getFullYear();
}

function nowTime() {
  var d = new Date();
  var h = d.getHours(), m = d.getMinutes();
  var ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + pad(m) + ' ' + ampm;
}

function nowDisplay() {
  var d = new Date();
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var h = d.getHours(), m = d.getMinutes();
  var ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() + '  |  ' + h + ':' + pad(m) + ' ' + ampm;
}

function generatePIN() {
  var digits = '';
  for (var i = 0; i < 4; i++) {
    digits += String(Math.floor(Math.random() * 10));
  }
  return digits;
}

function adjust(id, delta) {
  var el = document.getElementById(id);
  var val = parseInt(el.value) || 0;
  el.value = Math.max(0, val + delta);
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(function() { t.classList.remove('show'); }, 3500);
}

async function submitForm() {
  var driver      = document.getElementById('d_driver').value.trim();
  var driverPhone = document.getElementById('d_driverphone').value.trim();
  var carrier     = document.getElementById('d_carrier').value.trim();
  var carrierPhone = document.getElementById('d_carrierphone').value.trim();
  var dropOff     = document.getElementById('d_dropoff').value || '0';
  var pickup      = document.getElementById('d_pickup').value || '0';

  if (!driver)      { showToast('Please enter your name'); return; }
  if (!driverPhone) { showToast('Please enter your phone number'); return; }
  if (!carrier)     { showToast('Please enter carrier name'); return; }

  var btn = document.getElementById('submitBtn');
  btn.disabled  = true;
  btn.innerHTML = 'Submitting...';

  // Row: Date, Driver, DriverPhone, Carrier, CarrierPhone, Lane, DropOff, Pickup, Associate, TimeIn, TimeOut, Comments, PIN
  var pin = generatePIN();
  var row = [
    nowDate(),
    driver,
    driverPhone,
    carrier,
    carrierPhone,
    '',
    dropOff,
    pickup,
    '',
    nowTime(),
    '',
    '',
    pin
  ];

  var qs = 'action=append&row=' + encodeURIComponent(JSON.stringify(row));

  try {
    await fetch(WEB_APP_URL + '?' + qs, { method: 'GET', mode: 'no-cors' });
    await new Promise(function(r) { setTimeout(r, 1800); });

    document.getElementById('formWrap').style.display = 'none';
    var ss = document.getElementById('successScreen');
    ss.classList.add('visible');
    document.getElementById('successTime').textContent = nowDisplay();
    document.getElementById('pinDisplay').textContent  = pin;

  } catch(err) {
    showToast('Submission failed. Please try again.');
    btn.disabled  = false;
    btn.innerHTML = '<span>&#10003;</span> Submit Check-In';
  }
}

function resetForm() {
  ['d_driver','d_driverphone','d_carrier','d_carrierphone','d_comments'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('d_dropoff').value = '0';
  document.getElementById('d_pickup').value  = '0';
  document.getElementById('successScreen').classList.remove('visible');
  document.getElementById('formWrap').style.display = 'block';
  var btn = document.getElementById('submitBtn');
  btn.disabled  = false;
  btn.innerHTML = '<span>&#10003;</span> Submit Check-In';
  window.scrollTo(0, 0);
}
</script>
</body>
</html>
