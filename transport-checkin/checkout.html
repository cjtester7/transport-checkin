<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Driver Check-Out v5</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --black:   #0a0a0a;
    --blue:    #1565C0;
    --blue-lt: #1976D2;
    --blue-dk: #0D47A1;
    --white:   #ffffff;
    --gray:    #f2f2f2;
    --gray2:   #e0e0e0;
    --text:    #0a0a0a;
    --text2:   #444;
    --red:     #d32f2f;
    --green:   #1b7a3e;
  }

  html, body {
    min-height: 100vh;
    background: var(--black);
    font-family: 'Noto Sans', sans-serif;
  }

  /* Header */
  .page-header {
    background: var(--blue);
    padding: 28px 20px 22px;
    position: relative;
    overflow: hidden;
  }
  .page-header::after {
    content: '';
    position: absolute;
    bottom: -20px;
    left: 0; right: 0;
    height: 40px;
    background: var(--black);
    clip-path: polygon(0 50%, 100% 0, 100% 100%, 0 100%);
  }
  .header-inner {
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: 540px;
    margin: 0 auto;
  }
  .header-icon-wrap {
    width: 56px; height: 56px;
    background: var(--black);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
  }
  .header-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 30px;
    color: var(--white);
    line-height: 1;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .header-sub {
    font-size: 13px;
    font-weight: 700;
    color: rgba(255,255,255,0.65);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 3px;
  }

  /* Body */
  .page-body {
    padding: 36px 20px 60px;
    max-width: 540px;
    margin: 0 auto;
  }

  .section-label {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--blue-lt);
    margin-bottom: 12px;
    padding-left: 10px;
    border-left: 3px solid var(--blue-lt);
  }

  .card {
    background: var(--white);
    border-radius: 10px;
    padding: 20px 16px;
    margin-bottom: 16px;
  }

  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }

  .field-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text2);
    margin-bottom: 6px;
  }
  .field-label .req { color: var(--red); margin-left: 2px; }

  .field-input {
    width: 100%;
    background: var(--gray);
    border: 2px solid var(--gray2);
    border-radius: 6px;
    padding: 14px 16px;
    font-family: 'Noto Sans', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, background 0.15s;
    -webkit-appearance: none;
  }
  .field-input:focus {
    border-color: var(--blue-lt);
    background: var(--white);
  }
  .field-input::placeholder { color: #aaa; font-weight: 400; }

  /* Submit button */
  .btn-submit {
    width: 100%;
    padding: 20px;
    background: var(--blue);
    border: none;
    border-radius: 10px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 24px;
    letter-spacing: 1px;
    color: var(--white);
    cursor: pointer;
    text-transform: uppercase;
    transition: transform 0.1s, background 0.15s;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .btn-submit:active { transform: scale(0.98); background: var(--blue-dk); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Status messages */
  .msg-box {
    border-radius: 10px;
    padding: 16px;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 16px;
    display: none;
  }
  .msg-box.show { display: block; }
  .msg-error {
    background: rgba(211,47,47,0.1);
    border: 2px solid rgba(211,47,47,0.4);
    color: var(--red);
  }
  .msg-found {
    background: rgba(25,118,210,0.1);
    border: 2px solid rgba(25,118,210,0.4);
    color: var(--blue-lt);
  }

  /* Success screen */
  .success-screen {
    display: none;
    text-align: center;
    padding: 48px 24px;
  }
  .success-screen.visible { display: block; }
  .success-icon {
    width: 90px; height: 90px;
    background: var(--blue);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 44px;
    margin: 0 auto 24px;
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .success-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 36px;
    color: var(--blue-lt);
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 10px;
  }
  .success-sub {
    font-size: 16px;
    color: #aaa;
    line-height: 1.5;
    margin-bottom: 8px;
  }
  .success-time {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 22px;
    color: var(--white);
    margin-bottom: 32px;
  }
  .btn-again {
    display: inline-block;
    padding: 16px 36px;
    background: transparent;
    border: 3px solid var(--blue-lt);
    border-radius: 10px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 20px;
    color: var(--blue-lt);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: background 0.15s;
  }
  .btn-again:hover { background: rgba(25,118,210,0.15); }

  .req-note {
    font-size: 12px;
    color: #888;
    text-align: center;
    margin-bottom: 20px;
  }
  .req-note span { color: var(--red); }

  #formWrap { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--red);
    color: white;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 24px;
    border-radius: 30px;
    white-space: nowrap;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="page-header">
  <div class="header-inner">
    <div class="header-icon-wrap">🚛</div>
    <div>
      <div class="header-title">Driver Check-Out</div>
      <div class="header-sub">Enter your PIN to check out &nbsp;|&nbsp; v5</div>
    </div>
  </div>
</div>

<div class="page-body">

  <!-- Form -->
  <div id="formWrap">
    <p class="req-note"><span>*</span> Required fields</p>

        <!-- Step 1: Enter PIN -->
    <div id="step1">
      <div class="section-label">Enter Your PIN</div>
      <div class="card" style="text-align:center;padding:28px 16px">
        <div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#666;margin-bottom:16px">
          Enter the 4-digit PIN from your check-in
        </div>
        <input
          class="field-input"
          id="co_pin"
          type="number"
          inputmode="numeric"
          pattern="[0-9]*"
          placeholder="0000"
          oninput="onPinInput(this)"
          style="text-align:center;font-family:'Black Han Sans',sans-serif;font-size:48px;letter-spacing:12px;padding:16px;border:3px solid #e0e0e0;max-width:240px;margin:0 auto;display:block"
        />
        <div style="font-size:12px;color:#aaa;margin-top:12px">The PIN was shown after you checked in</div>
      </div>
      <div class="msg-box msg-error" id="msgError"></div>
      <button class="btn-submit" id="lookupBtn" onclick="lookupByPIN()">
        Find My Record
      </button>
    </div>

    <!-- Step 2: Confirm -->
    <div id="step2" style="display:none">
      <div class="section-label">Is this you?</div>
      <div class="card" style="text-align:center;padding:24px 16px">
        <div style="font-size:13px;color:#666;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Your Check-In Record</div>
        <div id="confirmName" style="font-family:'Black Han Sans',sans-serif;font-size:32px;color:#0a0a0a;line-height:1;margin-bottom:6px"></div>
        <div id="confirmDetail" style="font-size:14px;color:#555"></div>
      </div>
      <button class="btn-submit" id="confirmBtn" onclick="confirmCheckOut()">
        &#10003; Confirm Check-Out
      </button>
      <button onclick="goBack()" style="width:100%;padding:14px;background:none;border:none;color:rgba(255,255,255,0.5);font-family:'Black Han Sans',sans-serif;font-size:16px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;margin-top:4px">
        Not Me - Go Back
      </button>
    </div>

</div>

</div>

<div class="toast" id="toast"></div>

<script>
var SHEET_ID    = '10Ur-rkpsHkb8oaIKVVO1rDQQoFWaMco_Q21ZpP3Wq2k';
var SHEET_NAME  = 'Check-In';
var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx5rRVcMJBFVsU6Zk311B3IK6K2xXoJfm0ED-jGVkT6fuaWw98kukXW0H1ZHSqHOwmeaA/exec';

// Col indices (0-based): 10=TimeOut, 12=PIN
var COL_TIMEOUT_ZERO = 10;
var COL_PIN_ZERO     = 12;
// Col numbers (1-based for Apps Script update action)
var COL_TIMEOUT_ONE  = 11;

var matchedDriver = null;

function pad(n) { return String(n).padStart(2, '0'); }

function nowTime() {
  var d = new Date();
  var h = d.getHours(), m = d.getMinutes();
  var ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + pad(m) + ' ' + ampm;
}

function nowDisplay() {
  var d = new Date();
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var h = d.getHours(), m = d.getMinutes();
  var ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() + '  |  ' + h + ':' + pad(m) + ' ' + ampm;
}

function parseCSV(text) {
  var result = [];
  var rows = text.split(String.fromCharCode(10));
  for (var r = 0; r < rows.length; r++) {
    var line = rows[r];
    var cols = [], cur = '', inQ = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (c === '"') { inQ = !inQ; continue; }
      if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; continue; }
      cur += c;
    }
    cols.push(cur.trim());
    if (cols.length > 1) result.push(cols);
  }
  return result;
}

function onPinInput(input) {
  // Allow digits only, max 4
  var digits = '';
  for (var i = 0; i < input.value.length; i++) {
    var code = input.value.charCodeAt(i);
    if (code >= 48 && code <= 57) digits += input.value[i];
  }
  input.value = digits.slice(0, 4);
  // Auto-submit when 4 digits entered
  if (input.value.length === 4) {
    lookupByPIN();
  }
}

async function lookupByPIN() {
  var pinVal = document.getElementById('co_pin').value.trim();
  var errBox = document.getElementById('msgError');
  errBox.classList.remove('show');
  matchedDriver = null;

  if (pinVal.length !== 4) {
    showError('Please enter your 4-digit PIN.');
    return;
  }

  var btn = document.getElementById('lookupBtn');
  btn.disabled  = true;
  btn.innerHTML = 'Looking up...';

  try {
    var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
              '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(SHEET_NAME);
    var res = await fetch(url);
    if (!res.ok) throw new Error('Could not load sheet');
    var text = await res.text();
    var rows = parseCSV(text).slice(1);

    for (var i = 0; i < rows.length; i++) {
      var row    = rows[i];
      var rowPIN = String(row[COL_PIN_ZERO] || '').trim();
      var rowOut = String(row[COL_TIMEOUT_ZERO] || '').trim();
      var notOut = !rowOut || rowOut === '0';

      if (rowPIN === pinVal && notOut) {
        matchedDriver = {
          rowNum:  i + 2,
          name:    String(row[1] || '').trim(),
          carrier: String(row[3] || '').trim(),
          timeIn:  String(row[9] || '').trim()
        };
        // Last match wins in case of duplicate PINs on same day
      }
    }

    if (!matchedDriver) {
      showError('PIN not found or already checked out. Please check your PIN or see a staff member.');
      btn.disabled  = false;
      btn.innerHTML = 'Find My Record';
      return;
    }

    // Show confirm step
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
    document.getElementById('confirmName').textContent = matchedDriver.name;
    var details = [];
    if (matchedDriver.carrier) details.push(matchedDriver.carrier);
    if (matchedDriver.timeIn)  details.push('Checked in: ' + matchedDriver.timeIn);
    document.getElementById('confirmDetail').textContent = details.join('  |  ');

  } catch(err) {
    showError('Could not look up your PIN. Please try again.');
    btn.disabled  = false;
    btn.innerHTML = 'Find My Record';
  }
}

async function confirmCheckOut() {
  if (!matchedDriver) return;

  var btn = document.getElementById('confirmBtn');
  btn.disabled  = true;
  btn.innerHTML = 'Checking you out...';

  try {
    var timeOut = nowTime();
    var qs = 'action=update&rowNum=' + matchedDriver.rowNum +
             '&col=' + COL_TIMEOUT_ONE +
             '&value=' + encodeURIComponent(timeOut);
    await fetch(WEB_APP_URL + '?' + qs, { method: 'GET', mode: 'no-cors' });
    await new Promise(function(r) { setTimeout(r, 1800); });

    document.getElementById('step2').style.display    = 'none';
    document.getElementById('formWrap').style.display = 'none';
    document.getElementById('successScreen').classList.add('visible');
    document.getElementById('successName').textContent = 'Safe travels, ' + matchedDriver.name + '!';
    document.getElementById('successTime').textContent = nowDisplay();

  } catch(err) {
    showError('Something went wrong. Please try again or see a staff member.');
    btn.disabled  = false;
    btn.innerHTML = '&#10003; Confirm Check-Out';
  }
}

function goBack() {
  matchedDriver = null;
  document.getElementById('step2').style.display  = 'none';
  document.getElementById('step1').style.display  = 'block';
  document.getElementById('co_pin').value = '';
  document.getElementById('msgError').classList.remove('show');
  var btn = document.getElementById('lookupBtn');
  btn.disabled  = false;
  btn.innerHTML = 'Find My Record';
}

function resetForm() {
  matchedDriver = null;
  document.getElementById('co_pin').value = '';
  document.getElementById('msgError').classList.remove('show');
  document.getElementById('step2').style.display    = 'none';
  document.getElementById('step1').style.display    = 'block';
  document.getElementById('successScreen').classList.remove('visible');
  document.getElementById('formWrap').style.display = 'block';
  var btn = document.getElementById('lookupBtn');
  btn.disabled  = false;
  btn.innerHTML = 'Find My Record';
  window.scrollTo(0, 0);
}

function showError(msg) {
  var errBox = document.getElementById('msgError');
  errBox.textContent = msg;
  errBox.classList.add('show');
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    var s2 = document.getElementById('step2');
    if (s2 && s2.style.display === 'block') {
      confirmCheckOut();
    } else {
      var btn = document.getElementById('lookupBtn');
      if (btn && !btn.disabled) lookupByPIN();
    }
  }
});
</script>
</body>
</html>
