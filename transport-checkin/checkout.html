<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Driver Check-Out</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --black:   #0a0a0a;
    --blue:    #1565C0;
    --blue-lt: #1976D2;
    --blue-dk: #0D47A1;
    --white:   #ffffff;
    --gray:    #f2f2f2;
    --gray2:   #e0e0e0;
    --text:    #0a0a0a;
    --text2:   #444;
    --red:     #d32f2f;
    --green:   #1b7a3e;
  }

  html, body {
    min-height: 100vh;
    background: var(--black);
    font-family: 'Noto Sans', sans-serif;
  }

  /* Header */
  .page-header {
    background: var(--blue);
    padding: 28px 20px 22px;
    position: relative;
    overflow: hidden;
  }
  .page-header::after {
    content: '';
    position: absolute;
    bottom: -20px;
    left: 0; right: 0;
    height: 40px;
    background: var(--black);
    clip-path: polygon(0 50%, 100% 0, 100% 100%, 0 100%);
  }
  .header-inner {
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: 540px;
    margin: 0 auto;
  }
  .header-icon-wrap {
    width: 56px; height: 56px;
    background: var(--black);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
  }
  .header-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 30px;
    color: var(--white);
    line-height: 1;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .header-sub {
    font-size: 13px;
    font-weight: 700;
    color: rgba(255,255,255,0.65);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 3px;
  }

  /* Body */
  .page-body {
    padding: 36px 20px 60px;
    max-width: 540px;
    margin: 0 auto;
  }

  .section-label {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--blue-lt);
    margin-bottom: 12px;
    padding-left: 10px;
    border-left: 3px solid var(--blue-lt);
  }

  .card {
    background: var(--white);
    border-radius: 10px;
    padding: 20px 16px;
    margin-bottom: 16px;
  }

  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }

  .field-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text2);
    margin-bottom: 6px;
  }
  .field-label .req { color: var(--red); margin-left: 2px; }

  .field-input {
    width: 100%;
    background: var(--gray);
    border: 2px solid var(--gray2);
    border-radius: 6px;
    padding: 14px 16px;
    font-family: 'Noto Sans', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, background 0.15s;
    -webkit-appearance: none;
  }
  .field-input:focus {
    border-color: var(--blue-lt);
    background: var(--white);
  }
  .field-input::placeholder { color: #aaa; font-weight: 400; }

  /* Submit button */
  .btn-submit {
    width: 100%;
    padding: 20px;
    background: var(--blue);
    border: none;
    border-radius: 10px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 24px;
    letter-spacing: 1px;
    color: var(--white);
    cursor: pointer;
    text-transform: uppercase;
    transition: transform 0.1s, background 0.15s;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .btn-submit:active { transform: scale(0.98); background: var(--blue-dk); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Status messages */
  .msg-box {
    border-radius: 10px;
    padding: 16px;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 16px;
    display: none;
  }
  .msg-box.show { display: block; }
  .msg-error {
    background: rgba(211,47,47,0.1);
    border: 2px solid rgba(211,47,47,0.4);
    color: var(--red);
  }
  .msg-found {
    background: rgba(25,118,210,0.1);
    border: 2px solid rgba(25,118,210,0.4);
    color: var(--blue-lt);
  }

  /* Success screen */
  .success-screen {
    display: none;
    text-align: center;
    padding: 48px 24px;
  }
  .success-screen.visible { display: block; }
  .success-icon {
    width: 90px; height: 90px;
    background: var(--blue);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 44px;
    margin: 0 auto 24px;
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .success-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 36px;
    color: var(--blue-lt);
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 10px;
  }
  .success-sub {
    font-size: 16px;
    color: #aaa;
    line-height: 1.5;
    margin-bottom: 8px;
  }
  .success-time {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 22px;
    color: var(--white);
    margin-bottom: 32px;
  }
  .btn-again {
    display: inline-block;
    padding: 16px 36px;
    background: transparent;
    border: 3px solid var(--blue-lt);
    border-radius: 10px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 20px;
    color: var(--blue-lt);
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: background 0.15s;
  }
  .btn-again:hover { background: rgba(25,118,210,0.15); }

  .req-note {
    font-size: 12px;
    color: #888;
    text-align: center;
    margin-bottom: 20px;
  }
  .req-note span { color: var(--red); }

  #formWrap { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--red);
    color: white;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 24px;
    border-radius: 30px;
    white-space: nowrap;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="page-header">
  <div class="header-inner">
    <div class="header-icon-wrap">🚛</div>
    <div>
      <div class="header-title">Driver Check-Out</div>
      <div class="header-sub">Enter your details to check out</div>
    </div>
  </div>
</div>

<div class="page-body">

  <!-- Form -->
  <div id="formWrap">
    <p class="req-note"><span>*</span> Required fields</p>

    <div class="section-label">Select Your Name</div>
    <div class="card">
      <div class="field">
        <label class="field-label">Drivers Currently On Site <span class="req">*</span></label>
        <div id="loadingMsg" style="color:#aaa;font-size:15px;padding:10px 0">Loading drivers...</div>
        <select class="field-input" id="co_select" style="display:none;cursor:pointer" onchange="onDriverSelect(this)">
          <option value="">-- Select your name --</option>
        </select>
      </div>
      <div id="selectedInfo" style="display:none;margin-top:12px;background:#f0f4ff;border-radius:8px;padding:12px 14px;border:2px solid #c5d5f5">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#666;margin-bottom:4px">Selected Driver</div>
        <div id="selectedName" style="font-size:20px;font-weight:700;color:#0a0a0a;font-family:'Black Han Sans',sans-serif"></div>
        <div id="selectedDetail" style="font-size:13px;color:#555;margin-top:2px"></div>
      </div>
    </div>

    <div class="msg-box msg-error" id="msgError"></div>

    <button class="btn-submit" id="submitBtn" onclick="submitCheckOut()" style="display:none">
      &#10003; Confirm Check-Out
    </button>
  </div>

  <!-- Success -->
  <div class="success-screen" id="successScreen">
    <div class="success-icon">&#10003;</div>
    <div class="success-title">Checked Out!</div>
    <div class="success-sub" id="successName"></div>
    <div class="success-time" id="successTime"></div>
    <button class="btn-again" onclick="resetForm()">New Check-Out</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
var SHEET_ID    = '10Ur-rkpsHkb8oaIKVVO1rDQQoFWaMco_Q21ZpP3Wq2k';
var SHEET_NAME  = 'Check-In';
var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx5rRVcMJBFVsU6Zk311B3IK6K2xXoJfm0ED-jGVkT6fuaWw98kukXW0H1ZHSqHOwmeaA/exec';

var onSiteDrivers = [];
var selectedDriver = null;

function pad(n) { return String(n).padStart(2, '0'); }

function nowTime() {
  var d = new Date();
  var h = d.getHours(), m = d.getMinutes();
  var ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + pad(m) + ' ' + ampm;
}

function nowDisplay() {
  var d = new Date();
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var h = d.getHours(), m = d.getMinutes();
  var ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() + '  |  ' + h + ':' + pad(m) + ' ' + ampm;
}

function stripNonDigits(s) {
  var out = '';
  for (var i = 0; i < s.length; i++) {
    var code = s.charCodeAt(i);
    if (code >= 48 && code <= 57) out += s[i];
  }
  return out;
}

function formatPhone(p) {
  if (!p) return '';
  var d = stripNonDigits(String(p));
  if (d.length === 10) return d.slice(0,3) + '-' + d.slice(3,6) + '-' + d.slice(6);
  if (d.length === 11 && d[0] === '1') return d.slice(1,4) + '-' + d.slice(4,7) + '-' + d.slice(7);
  return p;
}

function formatTime(t) {
  if (!t) return '';
  t = String(t).trim();
  if (!t || t === '0') return '';
  if (t.indexOf('AM') >= 0 || t.indexOf('PM') >= 0) return t;
  if (t.indexOf(':') >= 0) {
    var parts = t.split(':');
    var h = parseInt(parts[0]);
    var m = parseInt(parts[1]);
    var ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return h + ':' + pad(m) + ' ' + ampm;
  }
  return t;
}

function parseCSV(text) {
  var result = [];
  var rows = text.split(String.fromCharCode(10));
  for (var r = 0; r < rows.length; r++) {
    var line = rows[r];
    var cols = [];
    var cur = '';
    var inQ = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (c === '"') { inQ = !inQ; continue; }
      if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; continue; }
      cur += c;
    }
    cols.push(cur.trim());
    if (cols.length > 1) result.push(cols);
  }
  return result;
}

async function loadOnSiteDrivers() {
  var loadMsg  = document.getElementById('loadingMsg');
  var selectEl = document.getElementById('co_select');
  var errBox   = document.getElementById('msgError');
  errBox.classList.remove('show');

  try {
    var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
              '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(SHEET_NAME);
    var res = await fetch(url);
    if (!res.ok) throw new Error('Could not load sheet');
    var text = await res.text();
    var rows = parseCSV(text).slice(1);

    onSiteDrivers = [];
    for (var i = 0; i < rows.length; i++) {
      var row     = rows[i];
      var driver  = String(row[1] || '').trim();
      var timeOut = String(row[10] || '').trim();
      var notOut  = !timeOut || timeOut === '0';
      if (driver && notOut) {
        onSiteDrivers.push({
          rowNum:  i + 2,
          name:    driver,
          phone:   formatPhone(row[2] || ''),
          carrier: String(row[3] || ''),
          timeIn:  formatTime(row[9] || '')
        });
      }
    }

    loadMsg.style.display = 'none';

    if (onSiteDrivers.length === 0) {
      loadMsg.textContent   = 'No drivers currently on site.';
      loadMsg.style.color   = '#888';
      loadMsg.style.display = 'block';
      return;
    }

    selectEl.innerHTML = '<option value="">-- Select your name --</option>';
    for (var j = 0; j < onSiteDrivers.length; j++) {
      var d   = onSiteDrivers[j];
      var opt = document.createElement('option');
      opt.value = j;
      var label = d.name;
      if (d.phone)   label += '  |  ' + d.phone;
      if (d.timeIn)  label += '  |  In: ' + d.timeIn;
      opt.textContent = label;
      selectEl.appendChild(opt);
    }
    selectEl.style.display = 'block';

  } catch(err) {
    loadMsg.textContent   = 'Could not load driver list. Please try again.';
    loadMsg.style.color   = '#d32f2f';
    loadMsg.style.display = 'block';
  }
}

function onDriverSelect(sel) {
  var infoBox   = document.getElementById('selectedInfo');
  var nameEl    = document.getElementById('selectedName');
  var detailEl  = document.getElementById('selectedDetail');
  var submitBtn = document.getElementById('submitBtn');

  if (sel.value === '') {
    infoBox.style.display   = 'none';
    submitBtn.style.display = 'none';
    selectedDriver = null;
    return;
  }

  var idx        = parseInt(sel.value);
  selectedDriver = onSiteDrivers[idx];

  nameEl.textContent = selectedDriver.name;
  var details = [];
  if (selectedDriver.phone)   details.push(selectedDriver.phone);
  if (selectedDriver.carrier) details.push(selectedDriver.carrier);
  if (selectedDriver.timeIn)  details.push('Checked in: ' + selectedDriver.timeIn);
  detailEl.textContent = details.join('  |  ');

  infoBox.style.display   = 'block';
  submitBtn.style.display = 'flex';
}

async function submitCheckOut() {
  if (!selectedDriver) {
    var errBox = document.getElementById('msgError');
    errBox.textContent = 'Please select your name from the list.';
    errBox.classList.add('show');
    return;
  }

  var btn = document.getElementById('submitBtn');
  btn.disabled  = true;
  btn.innerHTML = 'Checking you out...';

  try {
    var timeOut = nowTime();
    var qs = 'action=update&rowNum=' + selectedDriver.rowNum +
             '&col=11&value=' + encodeURIComponent(timeOut);
    await fetch(WEB_APP_URL + '?' + qs, { method: 'GET', mode: 'no-cors' });
    await new Promise(function(r) { setTimeout(r, 1800); });

    document.getElementById('formWrap').style.display = 'none';
    document.getElementById('successScreen').classList.add('visible');
    document.getElementById('successName').textContent = 'Safe travels, ' + selectedDriver.name + '!';
    document.getElementById('successTime').textContent = nowDisplay();

  } catch(err) {
    var errBox = document.getElementById('msgError');
    errBox.textContent = 'Something went wrong. Please try again or see a staff member.';
    errBox.classList.add('show');
    btn.disabled  = false;
    btn.innerHTML = '&#10003; Confirm Check-Out';
  }
}

function resetForm() {
  selectedDriver = null;
  document.getElementById('co_select').value         = '';
  document.getElementById('selectedInfo').style.display  = 'none';
  document.getElementById('submitBtn').style.display     = 'none';
  document.getElementById('msgError').classList.remove('show');
  document.getElementById('successScreen').classList.remove('visible');
  document.getElementById('formWrap').style.display  = 'block';
  var btn = document.getElementById('submitBtn');
  btn.disabled  = false;
  btn.innerHTML = '&#10003; Confirm Check-Out';
  var loadMsg  = document.getElementById('loadingMsg');
  var selectEl = document.getElementById('co_select');
  loadMsg.textContent   = 'Loading drivers...';
  loadMsg.style.color   = '#aaa';
  loadMsg.style.display = 'block';
  selectEl.style.display = 'none';
  loadOnSiteDrivers();
  window.scrollTo(0, 0);
}

window.addEventListener('DOMContentLoaded', function() {
  loadOnSiteDrivers();
});
</script>
</body>
</html>
